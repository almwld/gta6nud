name: Download 3D Model

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/download-model.yml"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check GitHub Release asset
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0-models --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release v1.0-models or its metadata was not found."
            echo "Create the release and upload anime_bikini_girl.glb before rerunning this workflow."
            echo "Expected asset: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v1.0-models"
          fi

      - name: Download Anime Bikini Girl GLB from GitHub Release
        if: steps.release.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets/models
          gh release download v1.0-models             --repo "${GITHUB_REPOSITORY}"             --pattern "anime_bikini_girl.glb"             --dir assets/models/             --clobber

      - name: Fallback instructions when Release is unavailable
        if: steps.release.outputs.exists != 'true'
        run: |
          echo "No download was attempted."
          echo "Manual setup:"
          echo "1. Open the v1.0-models release in GitHub."
          echo "2. Upload the legitimately obtained anime_bikini_girl.glb as a release asset."
          echo "3. Re-run this workflow."
          exit 1

      - name: Verify GLB
        shell: bash
        run: |
          set -euo pipefail
          FILE="assets/models/anime_bikini_girl.glb"
          FILE_SIZE=$(stat -c%s "$FILE")
          MAGIC=$(xxd -p -l 4 "$FILE")
          FILE_TYPE=$(file -b "$FILE")

          echo "Size: $FILE_SIZE bytes"
          echo "Type: $FILE_TYPE"
          echo "Magic: $MAGIC"

          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "ERROR: file is too small; refusing to treat it as a GLB."
            exit 1
          fi

          if [ "$MAGIC" != "676c5446" ]; then
            echo "ERROR: invalid GLB magic bytes. Expected 676c5446."
            exit 1
          fi

          if ! echo "$FILE_TYPE" | grep -Eiq 'glTF|GLB|binary'; then
            echo "WARNING: file(1) returned an unexpected type: $FILE_TYPE"
          fi

          echo "GLB validation passed."

      - name: Upload verified GLB artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-bikini-girl-glb
          path: assets/models/anime_bikini_girl.glb
          if-no-files-found: error

      - name: Commit GLB to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/anime_bikini_girl.glb
          git diff --cached --quiet || git commit -m "assets: add Anime Bikini Girl GLB (CC BY, ZeroVert)"
          git push
