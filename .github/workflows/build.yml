name: 🔥 Prometheus CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: 🚀 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🛠️ Prepare Android Shell
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: 🖼️ Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons:main

      - name: 🧰 Prepare Asset Directories
        run: |
          mkdir -p assets/icons assets/icons/svg assets/images assets/fonts assets/audio
      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔎 Analyze
        run: flutter analyze

      - name: 🧪 Test
        run: flutter test

      - name: 🛠️ Build Release APK
        run: flutter build apk --release

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gta6hub-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
