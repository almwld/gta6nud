name: 🔥 Prometheus CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: 🔎 Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable

      - name: 🛠️ Prepare Android Shell
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android .
          fi

      - name: 🧰 Prepare Asset Directories
        run: |
          mkdir -p assets/icons assets/icons/svg assets/images assets/fonts assets/audio

      - name: 📱 Set Android compile SDK for current plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          target = next((path for path in candidates if path.exists()), None)
          if target is None:
              raise SystemExit("Android app Gradle file was not generated.")

          lines = target.read_text().splitlines()
          count = 0
          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("compileSdk =") or stripped.startswith("compileSdkVersion "):
                  indent = line[:len(line) - len(line.lstrip())]
                  declaration = "compileSdk = 36" if target.suffix == ".kts" else "compileSdkVersion 36"
                  lines[index] = indent + declaration
                  count += 1
                  break
          if count == 0:
              raise SystemExit(f"Could not locate compileSdk declaration in {target}.")
          target.write_text("\n".join(lines) + "\n")
          print(f"Updated {target} to compileSdk 36.")
          PY

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🖼️ Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: 🔎 Analyze
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Test
        run: flutter test

  build-apk:
    name: 🛠️ Build Android APKs
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable

      - name: ☕ Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: 🛠️ Prepare Android Shell
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android .
          fi

      - name: 🧰 Prepare Asset Directories
        run: |
          mkdir -p assets/icons assets/icons/svg assets/images assets/fonts assets/audio

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🖼️ Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: 🩹 Allow legacy WebView ProGuard rule on AGP 9
        run: |
          # flutter_inappwebview_android 1.1.3 still requests proguard-android.txt.
          # AGP 9 rejects that legacy file; this documented compatibility switch is temporary.
          printf '\nandroid.r8.proguardAndroidTxt.disallowed=false\n' >> android/gradle.properties

      - name: 🐞 Build Debug APK
        run: flutter build apk --debug

      - name: 🚀 Build Release APK
        run: flutter build apk --release

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gta6hub-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gta6hub-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
