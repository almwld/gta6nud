include: package:flutter_lints/flutter.yaml

# Legacy explicit simulation sources are intentionally outside the production
# character presentation graph. They are preserved in-tree but are not part of
# the analyzed/buildable character pipeline.
analyzer:
  exclude:
    - lib/core/pleasure_manager.dart
    - lib/core/orgasm_engine.dart
    - lib/engine/fluids/cum_engine.dart

  # Keep legacy/forward-compatible lint findings visible without making
  # flutter analyze fail on non-error diagnostics. Real analyzer errors remain
  # fatal and must still be fixed before CI can proceed.
  errors:
    unused_field: info
    unused_import: info
    unnecessary_overrides: info

linter:
  rules:
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
